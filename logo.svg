<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="100%" height="100%">
  <defs>
    <!-- Gradients matching official brand identity -->
    <linearGradient id="blueBagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="pinkSwooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="60%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="pinkHandleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(15, 8)" filter="url(#softShadow)">
    <!-- Shopping Bag Handle (Pink Loop with Rivets) -->
    <path d="M 45 32 C 45 14 75 14 75 32" fill="none" stroke="url(#pinkHandleGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="45" cy="32" r="3.5" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
    <circle cx="75" cy="32" r="3.5" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>

    <!-- Upper Blue Shopping Bag Outer Arc -->
    <path d="M 38 40 C 38 31 43 27 52 27 L 78 27 C 88 27 94 32 98 42 C 104 55 106 70 102 83 C 98 94 90 101 79 104 C 84 94 84 80 81 68 C 78 57 70 47 58 43 C 49 40 42 40 38 40 Z" fill="url(#blueBagGrad)"/>

    <!-- Lower Pink Sweeping G Swoosh & Spur -->
    <path d="M 38 40 C 31 48 27 60 28 73 C 29 93 44 109 64 110 C 76 111 87 106 94 98 L 84 89 C 80 94 72 98 64 97 C 49 96 39 83 40 68 C 41 58 47 50 55 45 C 50 43 43 41 38 40 Z" fill="url(#pinkSwooshGrad)"/>
    
    <!-- Horizontal G Crossbar Arrow Spur -->
    <path d="M 64 74 L 98 74 C 100 74 101 76 100 78 L 91 93 C 90 94 88 94 87 93 L 78 84 L 64 84 Z" fill="url(#pinkSwooshGrad)"/>

    <!-- Three Chat Dots (Blue, Pink, Yellow) -->
    <circle cx="56" cy="62" r="4.5" fill="#2563EB"/>
    <circle cx="68" cy="62" r="4.5" fill="#EC4899"/>
    <circle cx="80" cy="62" r="4.5" fill="#FACC15"/>
  </g>

  <!-- LOGOTYPE TEXT -->
  <!-- "THE" -->
  <text x="145" y="44" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#2563EB" letter-spacing="4.5">THE</text>
  
  <!-- "GÉRONDY" -->
  <text x="143" y="82" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#0F172A" letter-spacing="2">GÉRONDY</text>
  
  <!-- Divider lines and "SHOP" -->
  <line x1="145" y1="99" x2="280" y2="99" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
  <text x="294" y="104" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#EC4899" letter-spacing="6">SHOP</text>
  <line x1="375" y1="99" x2="455" y2="99" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Slogan "SHOP. PAY. CHAT. ENJOY." -->
  <text x="145" y="128" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#2563EB" letter-spacing="4.8">SHOP. <tspan fill="#EC4899">PAY.</tspan> <tspan fill="#2563EB">CHAT.</tspan> <tspan fill="#EAB308">ENJOY.</tspan></text>
</svg>
