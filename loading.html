<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chargement - Gérondy Shop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, rgba(212,175,55,0.15), transparent 40%), linear-gradient(135deg, #0a0e1a 0%, #14192d 100%);
      font-family: 'Inter', sans-serif;
      color: #f1f1f1;
      overflow: hidden;
    }

    .loading-container {
      text-align: center;
      z-index: 10;
    }

    .loading-spinner {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      position: relative;
    }

    .spinner-ring {
      width: 100%;
      height: 100%;
      border: 5px solid rgba(212,175,55,0.2);
      border-top: 5px solid #D4AF37;
      border-radius: 50%;
      animation: spin 2s linear infinite;
    }

    .spinner-ring::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border: 5px solid rgba(212,175,55,0.1);
      border-right: 5px solid #ffd966;
      border-radius: 50%;
      animation: spin 3s linear infinite reverse;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.8rem;
      font-weight: 700;
      color: #FFD966;
      margin-bottom: 15px;
      animation: fadeInOut 2s ease-in-out infinite;
      text-shadow: 0 0 20px rgba(212,175,55,0.4);
    }

    .loading-subtext {
      font-size: 1rem;
      color: #d8d8d8;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .dots {
      display: inline-block;
      margin-left: 5px;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #D4AF37;
      border-radius: 50%;
      margin: 0 4px;
      animation: bounce 1.4s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.6; }
      40% { transform: translateY(-15px); opacity: 1; }
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .progress-bar {
      width: 300px;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin: 30px auto 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #D4AF37, #FFD966, #D4AF37);
      animation: progressFill 5s ease-in-out forwards;
      box-shadow: 0 0 15px rgba(212,175,55,0.8);
    }

    @keyframes progressFill {
      0% { width: 0%; }
      90% { width: 90%; }
      100% { width: 100%; }
    }

    .loading-percentage {
      font-size: 0.85rem;
      color: #b8b8b8;
      margin-top: 15px;
    }

    /* Animated background elements */
    .bg-element {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,175,55,0.2), transparent 70%);
      animation: float 8s ease-in-out infinite;
    }

    .bg-1 { width: 200px; height: 200px; top: -50px; left: -50px; animation-delay: 0s; }
    .bg-2 { width: 250px; height: 250px; bottom: -80px; right: -80px; animation-delay: 2s; }
    .bg-3 { width: 150px; height: 150px; top: 50%; left: 50%; animation-delay: 1s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -30px); }
    }

    .loading-message {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      color: #a8a8a8;
      text-align: center;
      max-width: 500px;
    }
  </style>
  <script>
    const siteRoot = window.location.pathname.replace(/\/[^/]*$/, '/');
    const goToPage = page => window.location.replace(siteRoot + page);

    // Vérifier que l'utilisateur est connecté
    const user = JSON.parse(localStorage.getItem('gerondy_user') || 'null');
    if (!user) {
      goToPage('index.html');
    }
  </script>
</head>
<body>
  <div class="bg-element bg-1"></div>
  <div class="bg-element bg-2"></div>
  <div class="bg-element bg-3"></div>

  <div class="loading-container">
    <div class="loading-spinner">
      <div class="spinner-ring"></div>
    </div>
    
    <div class="loading-text">
      Initialisation du tableau de bord vendeur
      <span class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </span>
    </div>

    <p class="loading-subtext">Veuillez patienter quelques instants</p>

    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>

    <div class="loading-percentage" id="loadingPercent">0%</div>

    <div class="loading-message">
      Nous préparons votre espace vendeur avec tous les outils nécessaires pour gérer vos produits et votre portefeuille.
    </div>
  </div>

  <script>
    // Progressive percentage update
    let percent = 0;
    const percentEl = document.getElementById('loadingPercent');
    
    const percentInterval = setInterval(() => {
      percent = Math.min(percent + Math.random() * 15, 90);
      percentEl.textContent = Math.round(percent) + '%';
    }, 500);

    // Redirect to seller dashboard after 5 seconds
    setTimeout(() => {
      clearInterval(percentInterval);
      percentEl.textContent = '100%';
      setTimeout(() => {
        goToPage('seller-dashboard.html');
      }, 500);
    }, 5000);
  </script>
</body>
</html>
