<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="iconPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="60%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="iconHandleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="iconGlow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <g transform="translate(0, 0)" filter="url(#iconGlow)">
    <!-- Shopping Bag Handle -->
    <path d="M 45 28 C 45 10 75 10 75 28" fill="none" stroke="url(#iconHandleGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="45" cy="28" r="3.5" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
    <circle cx="75" cy="28" r="3.5" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>

    <!-- Upper Blue Arc -->
    <path d="M 38 36 C 38 27 43 23 52 23 L 78 23 C 88 23 94 28 98 38 C 104 51 106 66 102 79 C 98 90 90 97 79 100 C 84 90 84 76 81 64 C 78 53 70 43 58 39 C 49 36 42 36 38 36 Z" fill="url(#iconBlueGrad)"/>

    <!-- Lower Pink G Swoosh -->
    <path d="M 38 36 C 31 44 27 56 28 69 C 29 89 44 105 64 106 C 76 107 87 102 94 94 L 84 85 C 80 90 72 94 64 93 C 49 92 39 79 40 64 C 41 54 47 46 55 41 C 50 39 43 37 38 36 Z" fill="url(#iconPinkGrad)"/>
    
    <!-- Spur / Crossbar -->
    <path d="M 64 70 L 98 70 C 100 70 101 72 100 74 L 91 89 C 90 90 88 90 87 89 L 78 80 L 64 80 Z" fill="url(#iconPinkGrad)"/>

    <!-- Three Chat Dots (Blue, Pink, Yellow) -->
    <circle cx="56" cy="58" r="4.5" fill="#2563EB"/>
    <circle cx="68" cy="58" r="4.5" fill="#EC4899"/>
    <circle cx="80" cy="58" r="4.5" fill="#FACC15"/>
  </g>
</svg>
